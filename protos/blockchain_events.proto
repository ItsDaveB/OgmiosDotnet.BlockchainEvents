syntax = "proto3";

option csharp_namespace = "BlockchainEvents.Worker.Grpc";

package blockchain_events;

// Service for streaming blockchain events to consumers.
service BlockchainEventService {
  // Server-side streaming: subscribe to filtered blockchain events in real time.
  rpc Subscribe (SubscribeRequest) returns (stream BlockchainEventMessage);

  // Get the current status of the event stream.
  rpc GetStatus (StatusRequest) returns (StatusResponse);
}

message SubscribeRequest {
  // Optional: filter by rule ID (e.g. "address-match"). Empty = all events.
  string rule_filter = 1;
}

message StatusRequest {}

message StatusResponse {
  int64 events_emitted = 1;
  int64 blocks_processed = 2;
  int64 last_processed_slot = 3;
  int32 active_grpc_subscribers = 4;
  string uptime = 5;
}

// CloudEvents 1.0 compliant message with Cardano extensions.
message BlockchainEventMessage {
  // CloudEvents standard attributes
  string spec_version = 1;
  string id = 2;
  string source = 3;
  string type = 4;
  string subject = 5;
  string time = 6;
  string data_content_type = 7;
  string data_schema = 8;

  // Cardano extension attributes
  int64 cardano_slot = 10;
  string cardano_block = 11;
  int64 cardano_block_height = 12;
  string cardano_era = 13;
  string cardano_network = 14;

  // Event payload
  TransactionMatchedPayload data = 20;
}

message TransactionMatchedPayload {
  string transaction_id = 1;
  int64 slot = 2;
  int64 block_height = 3;
  string block_hash = 4;
  string rule_id = 5;
  string rule_name = 6;
  map<string, string> matched_criteria = 7;
  TransactionPayload transaction = 8;
}

message TransactionPayload {
  string id = 1;
  int64 slot = 2;
  string block_hash = 3;
  int64 block_height = 4;
  int32 index = 5;
  int64 fee = 6;
  repeated string input_addresses = 7;
  repeated string output_addresses = 8;
  bool has_governance_action = 9;
  bool has_treasury_withdrawal = 10;
  bool has_stake_delegation = 11;
  bool has_stake_registration = 12;
  bool has_vote = 13;
}

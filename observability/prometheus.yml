global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'blockchain-events'
    static_configs:
      - targets: ['blockchain-events:4000']
    metrics_path: /metrics

  - job_name: 'dapr-sidecar'
    static_configs:
      - targets: ['blockchain-events:9090']
    metrics_path: /metrics

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

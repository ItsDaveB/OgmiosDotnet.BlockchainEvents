services:
  blockchain-events:
    build:
      context: .
      dockerfile: src/BlockchainEvents.Worker/Dockerfile.local
    ports:
      - '4000:4000'
      - '4010:4010'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:4000
      # Set DEMO_EVENTS=true to preview the UI with synthetic blocks (no Ogmios required).
      - DEMO_EVENTS=${DEMO_EVENTS:-false}
    volumes:
      - ${WORKER_APPSETTINGS:-./src/BlockchainEvents.Worker/appsettings.json}:/app/appsettings.json:ro
    networks:
      - blockchain-events-network
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      placement:
        condition: service_started

  blockchain-events-dapr:
    image: 'daprio/daprd:1.13.0'
    command: ['./daprd', '--app-id', 'blockchain-events', '--app-port', '4000', '--dapr-http-port', '3500', '--dapr-grpc-port', '50001', '--placement-host-address', 'placement:50006', '--resources-path', '/components', '--config', '/config/config.yaml', '--log-level', 'info']
    volumes:
      - ./dapr/components:/components:ro
      - ./dapr/config:/config:ro
      - ./dapr/secrets:/secrets:ro
    network_mode: 'service:blockchain-events'
    restart: unless-stopped
    depends_on:
      blockchain-events:
        condition: service_started
      redis:
        condition: service_healthy
      placement:
        condition: service_started

  demo-subscriber:
    build:
      context: .
      dockerfile: tools/BlockchainEvents.DemoSubscriber/Dockerfile.local
    ports:
      - '4001:4001'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:4001
    networks:
      - blockchain-events-network
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      placement:
        condition: service_started

  demo-subscriber-dapr:
    image: 'daprio/daprd:1.13.0'
    command: ['./daprd', '--app-id', 'demo-subscriber', '--app-port', '4001', '--dapr-http-port', '3501', '--dapr-grpc-port', '50002', '--placement-host-address', 'placement:50006', '--resources-path', '/components', '--config', '/config/config.yaml', '--log-level', 'info']
    volumes:
      - ./dapr/components:/components:ro
      - ./dapr/config:/config:ro
      - ./dapr/secrets:/secrets:ro
    network_mode: 'service:demo-subscriber'
    restart: unless-stopped
    depends_on:
      demo-subscriber:
        condition: service_started
      redis:
        condition: service_healthy
      placement:
        condition: service_started

  placement:
    image: 'daprio/placement:1.13.0'
    command: ['./placement', '--port', '50006']
    ports:
      - '50006:50006'
    networks:
      - blockchain-events-network

  redis:
    image: 'redis:7-alpine'
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: ['redis-server', '--appendonly', 'yes', '--stop-writes-on-bgsave-error', 'no']
    networks:
      - blockchain-events-network
    # Wait until Redis has finished loading AOF (PING alone can race with LOADING).
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG && redis-cli info persistence | grep -q "loading:0"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  zipkin:
    image: 'openzipkin/zipkin:latest'
    ports:
      - '4004:9411'
    networks:
      - blockchain-events-network

  prometheus:
    image: 'prom/prometheus:latest'
    ports:
      - '4003:9090'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - blockchain-events-network

  grafana:
    image: 'grafana/grafana:latest'
    ports:
      - '4002:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - blockchain-events-network
    depends_on:
      - prometheus

  dapr-dashboard:
    image: 'daprio/dashboard:latest'
    ports:
      - '4005:8080'
    command: ['--docker-compose=true', '--docker-compose-path=/docker-compose.yml', '--components-path=/components', '--config-path=/config/config.yaml']
    volumes:
      - ./docker-compose.yml:/docker-compose.yml:ro
      - ./dapr/components:/components:ro
      - ./dapr/config:/config:ro
    networks:
      - blockchain-events-network
    depends_on:
      - placement

  redis-commander:
    # Official image is linux/amd64-only; on Apple Silicon Docker runs it via emulation.
    platform: linux/amd64
    image: 'rediscommander/redis-commander:latest'
    ports:
      - '4006:8081'
    environment:
      # label:host:port — UI at http://localhost:4006
      - REDIS_HOSTS=local:redis:6379
      - HTTP_USER=
      - HTTP_PASSWORD=
    networks:
      - blockchain-events-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Image healthcheck.js often exceeds the default 2s timeout and marks the
    # container unhealthy even while the UI is serving fine — override it.
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8081/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  event-viewer-1:
    build:
      context: tools/event-viewer
      dockerfile: Dockerfile
    ports:
      - '4020:80'
    environment:
      - SSE_URL=http://localhost:4000/events/stream
      - INSTANCE_ID=All Rules
      - RULE_FILTER=
    networks:
      - blockchain-events-network
    depends_on:
      - blockchain-events

  event-viewer-2:
    build:
      context: tools/event-viewer
      dockerfile: Dockerfile
    ports:
      - '4021:80'
    environment:
      - SSE_URL=http://localhost:4000/events/stream
      - INSTANCE_ID=Metadata Filter
      - RULE_FILTER=metadata-key-value
    networks:
      - blockchain-events-network
    depends_on:
      - blockchain-events

  event-viewer-3:
    build:
      context: tools/event-viewer
      dockerfile: Dockerfile
    ports:
      - '4022:80'
    environment:
      - SSE_URL=http://localhost:4000/events/stream
      - INSTANCE_ID=Governance Filter
      - RULE_FILTER=governance-treasury
    networks:
      - blockchain-events-network
    depends_on:
      - blockchain-events

  event-viewer-4:
    build:
      context: tools/event-viewer
      dockerfile: Dockerfile
    ports:
      - '4023:80'
    environment:
      - SSE_URL=http://localhost:4000/events/stream
      - INSTANCE_ID=Address Filter
      - RULE_FILTER=address-match
    networks:
      - blockchain-events-network
    depends_on:
      - blockchain-events

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  blockchain-events-network:
    driver: bridge

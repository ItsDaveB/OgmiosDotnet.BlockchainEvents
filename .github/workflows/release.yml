name: Release

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '10.0.x'
  REGISTRY: ghcr.io

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --logger trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx

      - name: Pack NuGet packages
        run: |
          mkdir -p artifacts/nuget
          dotnet pack src/BlockchainEvents.Domain/BlockchainEvents.Domain.csproj \
            --no-build --configuration Release --output artifacts/nuget
          dotnet pack src/BlockchainEvents.Engine/BlockchainEvents.Engine.csproj \
            --no-build --configuration Release --output artifacts/nuget

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nuget/*

  publish-images:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image names (GHCR requires lowercase)
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VIEWER_IMAGE_NAME=${GITHUB_REPOSITORY,,}/event-viewer" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract worker metadata
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/BlockchainEvents.Worker/Dockerfile
          # amd64 only: arm64 via QEMU segfaults during Grpc.Tools/protoc publish
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract event-viewer metadata
        id: meta-viewer
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.VIEWER_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push event-viewer image
        uses: docker/build-push-action@v5
        with:
          context: tools/event-viewer
          file: tools/event-viewer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-viewer.outputs.tags }}
          labels: ${{ steps.meta-viewer.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-nuget:
    name: Publish NuGet Packages
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Download NuGet artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nuget

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish to GitHub Packages
        run: |
          for pkg in artifacts/nuget/*.nupkg; do
            dotnet nuget push "$pkg" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --skip-duplicate
          done

      # NuGet.org Trusted Publishing (OIDC): requires secret NUGET_USER + nuget.org policy
      # for this repo / workflow file `release.yml`. Skip when unset so GHCR + GitHub
      # Packages + GitHub Release still complete.
      # https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
      - name: Check NuGet.org Trusted Publishing config
        id: nuget-org
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "${NUGET_USER}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "NUGET_USER secret not set — skipping nuget.org (GitHub Packages already published)."
            echo "To enable: set repo secret NUGET_USER and add a Trusted Publishing policy for release.yml."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: NuGet.org login (OIDC → temporary API key)
        if: steps.nuget-org.outputs.configured == 'true'
        continue-on-error: true
        uses: NuGet/login@v1
        id: nuget-login
        with:
          # Must be the nuget.org username of the Trusted Publishing policy *creator*
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        if: steps.nuget-org.outputs.configured == 'true' && steps.nuget-login.outcome == 'success'
        run: |
          for pkg in artifacts/nuget/*.nupkg; do
            dotnet nuget push "$pkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done

      - name: Warn if nuget.org publish was skipped or failed
        if: steps.nuget-org.outputs.configured != 'true' || steps.nuget-login.outcome != 'success'
        run: |
          echo "::warning::nuget.org publish skipped/failed. GitHub Packages still published."
          echo "Ensure nuget.org Trusted Publishing policy exists for ItsDaveB/OgmiosDotnet.BlockchainEvents + release.yml,"
          echo "and NUGET_USER is the policy creator's nuget.org profile name (not email)."

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-images, publish-nuget]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download NuGet artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nuget

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          body: |
            ## OgmiosDotnet.BlockchainEvents ${{ github.ref_name }}

            ### Container images (GHCR)
            - Worker: `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
            - Event viewer: `ghcr.io/${{ github.repository }}/event-viewer:${{ github.ref_name }}`

            ### NuGet packages
            - `OgmiosDotnet.BlockchainEvents.Domain`
            - `OgmiosDotnet.BlockchainEvents.Engine`

            ### Setup
            See [README.md](https://github.com/${{ github.repository }}#running) and [docs/getting-started.md](https://github.com/${{ github.repository }}/blob/main/docs/getting-started.md).

            ### Example configurations
            - [examples/governance](https://github.com/${{ github.repository }}/tree/main/examples/governance)
            - [examples/treasury](https://github.com/${{ github.repository }}/tree/main/examples/treasury)
            - [examples/metadata](https://github.com/${{ github.repository }}/tree/main/examples/metadata)
